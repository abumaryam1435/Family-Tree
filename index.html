    <script>
      // AI Studio Environment Constraint: "HMR: Disabled. Ignore WebSocket errors."
      (function() {
        // 1. Intercept console.error to filter out Vite HMR WebSocket closing messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var str = String((item && (item.message || item.stack)) || item || '');
            if (
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('@vite/client') !== -1 ||
              str.indexOf('ws://') !== -1 ||
              str.indexOf('wss://') !== -1
            ) {
              return; // Silently ignore WebSocket errors as required by runtime constraints
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Intercept Vite HMR WebSocket in preview iframe so @vite/client never throws "WebSocket closed without opened."
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          var createNoopViteSocket = function() {
            return {
              readyState: 1,
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              protocol: 'vite-hmr',
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return true; },
              send: function() {},
              close: function() {}
            };
          };
          var WrappedWebSocket = function(url, protocols) {
            var protoStr = String(protocols || '');
            var urlStr = String(url || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1) {
              return createNoopViteSocket();
            }
            try {
              return protocols !== undefined
                ? new NativeWebSocket(url, protocols)
                : new NativeWebSocket(url);
            } catch (e) {
              return createNoopViteSocket();
            }
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = 0;
          WrappedWebSocket.OPEN = 1;
          WrappedWebSocket.CLOSING = 2;
          WrappedWebSocket.CLOSED = 3;
          window.WebSocket = WrappedWebSocket;
        }

        // 3. Catch window unhandled errors and rejections
        window.addEventListener('error', function(event) {
          var msg = String(event.message || (event.error && event.error.message) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? String(event.reason.message || event.reason) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
