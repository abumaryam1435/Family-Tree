<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C3A"/>
      <stop offset="50%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#051F17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="35%" stop-color="#F7DF94"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7A5E12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background with Green & Gold Border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.8"/>
  <rect x="22" y="22" width="468" height="468" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decorative Corner Ornaments -->
  <circle cx="48" cy="48" r="8" fill="url(#goldGrad)" />
  <circle cx="464" cy="48" r="8" fill="url(#goldGrad)" />
  <circle cx="48" cy="464" r="8" fill="url(#goldGrad)" />
  <circle cx="464" cy="464" r="8" fill="url(#goldGrad)" />

  <!-- Tree trunk and family branch graph -->
  <g transform="translate(256, 230)">
    <!-- Root Base / Trunk -->
    <path d="M-32,160 C-32,110 -16,50 0,-10 C16,50 32,110 32,160 Z" fill="url(#trunkGrad)"/>
    <path d="M-90,165 C-45,150 -22,125 0,55 C22,125 45,150 90,165" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Main Branches -->
    <path d="M0,10 C-45,-40 -90,-60 -135,-95" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M0,10 C45,-40 90,-60 135,-95" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M0,-10 C0,-75 0,-125 0,-155" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Sub Branches -->
    <path d="M-70,-50 C-105,-85 -145,-85 -180,-135" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M70,-50 C105,-85 145,-85 180,-135" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-25,-90 C-45,-135 -60,-165 -80,-195" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M25,-90 C45,-135 60,-165 80,-195" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>

    <!-- Family Nodes / Gold Badges -->
    <!-- Top Ancestor Node -->
    <circle cx="0" cy="-165" r="32" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="7" filter="url(#glow)"/>
    <circle cx="0" cy="-165" r="16" fill="#0F4C3A"/>

    <!-- 2nd Generation Nodes -->
    <circle cx="-135" cy="-95" r="25" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="-135" cy="-95" r="12" fill="#0F4C3A"/>

    <circle cx="135" cy="-95" r="25" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="135" cy="-95" r="12" fill="#0F4C3A"/>

    <!-- 3rd Generation Nodes -->
    <circle cx="-180" cy="-135" r="20" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="-80" cy="-195" r="20" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="80" cy="-195" r="20" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="180" cy="-135" r="20" fill="#FBF9F5" stroke="url(#goldGrad)" stroke-width="5"/>

    <!-- Leaves & Crown Flourishes -->
    <path d="M-135,-95 Q-170,-115 -155,-75 Z" fill="url(#goldGrad)"/>
    <path d="M135,-95 Q170,-115 155,-75 Z" fill="url(#goldGrad)"/>
    <path d="M0,-165 Q-30,-205 0,-215 Q30,-205 0,-165 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Banner Background Ribbon for Title -->
  <path d="M110,410 Q256,395 402,410 L412,460 Q256,445 100,460 Z" fill="#07261D" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="440" font-family="'Cairo', 'Tajawal', 'Traditional Arabic', sans-serif" font-size="36" font-weight="900" fill="#F7DF94" text-anchor="middle" letter-spacing="1">شجرة العائلة</text>
</svg>
